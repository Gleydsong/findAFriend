name: CI

on:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, typecheck, unit tests and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run unit tests
        run: npm test

      - name: Build application
        run: npm run build

  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docker:docker@localhost:55432/findafriend?schema=public
      JWT_SECRET: findafriend-dev-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: findafriend
          POSTGRES_USER: docker
          POSTGRES_PASSWORD: docker
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U docker -d findafriend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Run end-to-end tests
        run: npm run test:e2e
